<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg:#0B0C0B; --t1:#F2F4EF; --t3:#6E7368; --lime:#C8F751; }

  body { background:var(--bg); min-height:100vh; display:grid; place-items:center; font-family:-apple-system,sans-serif; }

  .mark { font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:56px; letter-spacing:-0.045em; color:var(--t1); }
  .mark .dot { color:var(--lime); }
  .meta { font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--t3); margin-top:12px; }
  a { color:var(--t3); font-family:"JetBrains Mono",monospace; font-size:12px; text-decoration:none; display:inline-block; margin-top:48px; }
  a:hover { color:var(--lime); }
</style>
</head>
